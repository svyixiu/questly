[package]
name = "discord-quest-completer"
version = "1.0.0"
description = "Questly: complete Discord quests without keeping the game open"
authors = ["svyixiu", "Mark Terence Tiglao (original Discord Quest Completer)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-sdk = "0.4.0"
tokio = "1.44.2"
once_cell = "1.21.3"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "=0.11", features = ["json", "multipart", "brotli", "gzip", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }

